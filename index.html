<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d"><meta name="description" content="Workout Timer">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css">
<title>Workout Timer</title></head><body>
<main id="app">
<section id="setup" class="screen"><header class="topbar"><div><div class="eyebrow">WORKOUT TIMER</div><h1>Prêt à t'entraîner ?</h1></div><button id="installBtn" class="icon-btn hidden">＋</button></header>
<div class="mode-grid" id="modeGrid"></div><section class="card" id="settingsCard"></section>
<button id="startBtn" class="primary big">DÉMARRER</button>
<section class="saved-section"><div class="section-title"><h2>Mes workouts</h2><button id="newWorkoutBtn" class="small-btn">+ Nouveau</button></div><div id="savedList"></div></section></section>
<section id="timer" class="screen hidden"><header class="timer-topbar"><button id="exitBtn" class="ghost">QUITTER</button><div id="timerTitle">WORKOUT</div><button id="soundBtn" class="ghost">🔊</button></header>
<div class="timer-content"><div id="prepLabel" class="phase-label">GET READY</div><div id="phaseLabel" class="phase-label hidden">WORK</div><div id="timeDisplay" class="time-display">00:10</div><div id="roundDisplay" class="round-display">ROUND 1 / 10</div><div id="totalDisplay" class="total-display"></div><div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
<div class="timer-actions"><button id="skipBtn" class="secondary">SKIP</button><button id="pauseBtn" class="primary circle">Ⅱ</button><button id="finishBtn" class="secondary hidden">FINISH</button></div></div></section>
<section id="done" class="screen hidden"><div class="done-box"><div class="done-icon">✓</div><div class="eyebrow">WORKOUT TERMINÉ</div><h1 id="doneTitle">Bien joué.</h1><div id="doneTime" class="done-time">00:00</div><button id="doneBackBtn" class="primary big">RETOUR</button></div></section>
</main><script src="app.js"></script></body></html>
